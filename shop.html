<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homeify — Furniture selection</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="screen">
      <header>
        <a class="brand" href="index.html">Homeify</a>
        <details class="menu">
          <summary aria-label="Open navigation">☰</summary>
          <nav>
            <a href="index.html">Home</a>
            <a href="shop.html" aria-current="page">Furniture selection</a>
            <a href="inspiration.html">Customize furniture</a>
          </nav>
        </details>
      </header>

      <main class="selection">
        <a class="back" href="index.html">← Home</a>
        <p class="step">02 / SELECT</p>
        <h1>Furniture Selection</h1>
        <p class="page-intro">Choose a piece to make your own.</p>
        <div class="products">
          <article class="product">
            <h2>Credenza</h2>
            <div class="furniture cabinet" role="img" aria-label="Cabinet outline">
              <i></i>
            </div>
            <p>Starting at $100</p>
            <a class="button" href="inspiration.html#credenza">Select <span class="sr-only">credenza</span></a>
          </article>

          <article class="product">
            <h2>Chair</h2>
            <div class="furniture chair" role="img" aria-label="Chair outline">
              <i></i>
            </div>
            <p>Starting at $50</p>
            <a class="button" href="inspiration.html#chair">Select <span class="sr-only">chair</span></a>
          </article>

          <article class="product">
            <h2>Sofa</h2>
            <div class="furniture sofa" role="img" aria-label="Sofa outline">
              <i></i>
            </div>
            <p>Starting at $150</p>
            <a class="button" href="inspiration.html#sofa">Select <span class="sr-only">sofa</span></a>
          </article>

        </div>
      </main>

      <footer>
        homify
      </footer>
    </div>
  </body>
</html>
